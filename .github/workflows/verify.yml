# The vault's number guards, run by a machine instead of by memory.
#
# On 2026-09-06 the TC_002 reports moved into a reports/ subfolder and three
# guards kept the old path. The suite went red and stayed red for two weeks,
# while 361 synthesis claims were checked against a file that did not exist.
# Nothing was wrong with the guards' logic - nobody was running them.
#
# This runs only what a bare clone can run: figures and raw flow data are
# gitignored as reproducible output, so the full `_suite.py` belongs on the
# machine that holds them. See analysis/scripts/_ci_suite.py for the split.
name: verify

on:
  # Deliberately NOT every push. The vault auto-commits every 30-60 minutes, so
  # an unfiltered trigger would spend the month's Actions minutes on backups of
  # daily notes. These are the paths where a number can actually break.
  push:
    paths:
      - 'analysis/scripts/**'
      - 'data/processed/**'
      - 'data/derived/**'
      - 'experiments/**/reports/**'
      - 'presentations/**'
      - '.github/workflows/verify.yml'
  # The backstop: catches breakage that arrives some other way - a table
  # regenerated by hand, a path that only fails once the month rolls over.
  schedule:
    - cron: '0 11 * * *'   # 07:00 America/New_York
  workflow_dispatch:

# A burst of auto-commits should not queue a burst of identical runs.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # NO INSTALL STEP. The checks in this repository are pure standard
      # library - json, re, subprocess, pathlib. The vault this was extracted
      # from also runs verifiers built on numpy/pandas/scipy/matplotlib; those
      # scripts are part of the research and are not here, and _ci_suite.py
      # skips any check whose script is absent.

      - name: Run the clone-runnable checks
        id: verify
        run: python analysis/scripts/_ci_suite.py

      # A red suite nobody sees is the failure this workflow exists to prevent,
      # so failure has to leave something behind that outlives the run log.
      - name: Open an issue if the guards are red
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Verifier guards are red"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still red on \`${GITHUB_SHA:0:7}\` — $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$(printf '%s\n' \
              "A number guard failed on \`${GITHUB_SHA:0:7}\`." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "This covers claims recomputed from committed tables. Figures, gates," \
              "embeds and day parity are NOT checked here — run" \
              "\`analysis/scripts/_suite.py\` locally for those.")"
          fi

      - name: Close the issue when the guards come back green
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Verifier guards are red in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Green again on \`${GITHUB_SHA:0:7}\`."
          fi
